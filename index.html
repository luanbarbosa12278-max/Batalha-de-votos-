<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalha de Votos | Premium</title>
<style>
:root{--red:#ff5265;--blue:#438cff;--white:#f5f7ff;--muted:#a7b2cf}*{box-sizing:border-box}html{min-height:100%;background:#070b19}body{margin:0;min-height:100dvh;color:var(--white);font-family:system-ui,-apple-system,Arial,sans-serif;background:radial-gradient(ellipse at 15% 12%,#54233866,transparent 43%),radial-gradient(ellipse at 88% 20%,#1848a855,transparent 44%),linear-gradient(165deg,#11172c,#080c1b 70%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(#0008,transparent 75%)}main{position:relative;max-width:540px;min-height:100dvh;margin:auto;padding:30px 15px 26px;display:flex;flex-direction:column;gap:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:11px;letter-spacing:2.2px;font-weight:900;color:#e1e7ff}.live{border:1px solid #ff657a66;background:#ff52651c;color:#ff99a6;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:900;letter-spacing:1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5265;box-shadow:0 0 10px #ff5265;margin-right:5px;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}header{text-align:center;padding:6px 0 2px}header h1{font-size:clamp(30px,8.5vw,46px);line-height:1.03;letter-spacing:-1.6px;margin:8px 0;font-weight:1000}header h1 span{background:linear-gradient(90deg,#ff7782,#fff 50%,#83b6ff);color:transparent;background-clip:text}header p{color:var(--muted);font-size:12px;margin:8px 0}.glass{background:linear-gradient(145deg,#ffffff17,#ffffff08);border:1px solid #ffffff25;box-shadow:0 22px 60px #0007,inset 0 1px #ffffff18;border-radius:27px;padding:17px 13px 19px;backdrop-filter:blur(18px)}.match{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:start;gap:4px}.fighter{min-width:0;text-align:center;position:relative;padding:10px 2px 15px;border-radius:21px;background:linear-gradient(180deg,var(--tint),#ffffff06);border:1px solid #ffffff12;transition:transform .25s}.fighter.pop{animation:bump .4s ease}@keyframes bump{50%{transform:scale(1.045)}}.portraitwrap{width:min(32vw,140px);height:min(32vw,140px);max-width:140px;max-height:140px;border-radius:50%;padding:5px;margin:0 auto 13px;background:linear-gradient(140deg,var(--accent),#ffffffa0,var(--accent));box-shadow:0 0 34px var(--glow),0 10px 30px #0006}.portrait{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;background:#242c46}.name{font-size:clamp(15px,4.4vw,21px);font-weight:1000;letter-spacing:-.5px}.pct{font-size:clamp(28px,8vw,43px);font-weight:1000;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin-top:5px}.count{font-size:12px;color:#c1c9e2;font-variant-numeric:tabular-nums}.vs{align-self:center;margin-top:-25px;text-align:center;font-size:13px;font-style:italic;font-weight:1000;color:#e6e9ff;text-shadow:0 0 20px #fff8}.label{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 9px;font-size:10px;font-weight:900;letter-spacing:1.5px;color:#cbd3ee}.track{height:29px;display:flex;border-radius:999px;overflow:hidden;background:#27314d;border:2px solid #ffffff2d;box-shadow:inset 0 2px 6px #0007}.red{width:50%;background:linear-gradient(90deg,#b92242,#ff5c68);transition:width .6s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 15px #ff526577}.blue{flex:1;background:linear-gradient(90deg,#4c94ff,#1d50c9)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stat{background:#050a1c80;border:1px solid #ffffff14;border-radius:14px;padding:12px 5px}.stat small{display:block;font-size:10px;letter-spacing:1.2px;color:#a8b4d5;font-weight:800}.stat strong{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-top:3px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vote{position:relative;overflow:hidden;min-height:74px;border:1px solid #ffffff42;border-radius:19px;color:white;font:900 14px system-ui;box-shadow:0 10px 26px #0005;cursor:pointer;touch-action:manipulation}.vote span{display:block;font-size:11px;opacity:.85;font-weight:700;margin-top:5px}.vote:active{transform:scale(.97)}.vote.l{background:linear-gradient(145deg,#ff6675,#b51d3e)}.vote.b{background:linear-gradient(145deg,#5ca7ff,#1645b9)}.reset{border:1px solid #ffffff20;background:#ffffff0c;color:#c6d0e9;padding:12px;border-radius:14px;font:800 12px system-ui;cursor:pointer}.footer{text-align:center;color:#8f9cba;font-size:10px;line-height:1.55;margin-top:auto}.spark{position:fixed;z-index:99;pointer-events:none;font-size:23px;font-weight:1000;animation:fly .9s ease-out forwards}@keyframes fly{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-100px) scale(1.5)}}@media(max-width:350px){main{padding:19px 9px}.glass{padding:12px 8px}.match{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr)}.vs{font-size:11px}.vote{font-size:12px}}
</style>
</head>
<body><main>
<div class="top"><div class="brand">◈ VOTE ARENA <span style="opacity:.45">/ 2.0</span></div><div class="live"><i class="dot"></i>INTERATIVO</div></div>
<header><h1><span>BATALHA<br>DE VOTOS</span></h1><p>LULA <b style="color:#f4f7ff">×</b> BOLSONARO</p></header>
<section class="glass"><div class="match">
<div class="fighter" id="cardL" style="--accent:#ff5265;--glow:#ff526544;--tint:#ff52651d"><div class="portraitwrap"><img class="portrait" src="./Lula.png" alt="Foto de Lula"></div><div class="name">LULA</div><div class="pct" id="pL">0,0%</div><div class="count" id="vL">0 votos</div></div>
<div class="vs">VS</div>
<div class="fighter" id="cardB" style="--accent:#438cff;--glow:#438cff44;--tint:#438cff1d"><div class="portraitwrap"><img class="portrait" src="./Bolsonaro.png" alt="Foto de Bolsonaro"></div><div class="name">BOLSONARO</div><div class="pct" id="pB">0,0%</div><div class="count" id="vB">0 votos</div></div>
</div><div class="label"><span>🔴 LULA</span><span>DISTRIBUIÇÃO</span><span>BOLSONARO 🔵</span></div><div class="track"><div class="red" id="red"></div><div class="blue"></div></div>
<div class="stats"><div class="stat"><small>TOTAL DE VOTOS</small><strong id="total">0</strong></div><div class="stat"><small>TEMPO DECORRIDO</small><strong id="timer">00:00</strong></div></div></section>
<div class="controls"><button class="vote l" id="voteL">+1 VOTO LULA<span>TOQUE PARA TESTAR</span></button><button class="vote b" id="voteB">+1 VOTO BOLSONARO<span>TOQUE PARA TESTAR</span></button></div>
<button class="reset" id="reset">↻ REINICIAR ENQUETE</button>
<div class="footer">ENQUETE INFORMAL · VOTOS MANUAIS<br>Não é pesquisa eleitoral nem representa a população.</div>
</main><script>
'use strict';const KEY='votacao-live-premium-v1';let data={l:0,b:0,start:Date.now()};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Number.isSafeInteger(d.l)&&d.l>=0&&Number.isSafeInteger(d.b)&&d.b>=0&&Number.isFinite(d.start))data=d}catch(e){}const el=id=>document.getElementById(id);const fmt=n=>n.toLocaleString('pt-BR');function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function update(){const t=data.l+data.b;const l=t?data.l/t*100:0,b=t?data.b/t*100:0;el('pL').textContent=l.toFixed(1).replace('.',',')+'%';el('pB').textContent=b.toFixed(1).replace('.',',')+'%';el('vL').textContent=fmt(data.l)+' votos';el('vB').textContent=fmt(data.b)+' votos';el('total').textContent=fmt(t);el('red').style.width=(t?l:50)+'%'}function sparkle(btn,color){const r=btn.getBoundingClientRect(),s=document.createElement('span');s.className='spark';s.textContent='+1';s.style.color=color;s.style.left=(r.left+r.width/2-12)+'px';s.style.top=r.top+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)}function vote(side){const btn=el(side==='l'?'voteL':'voteB'),card=el(side==='l'?'cardL':'cardB');data[side]++;save();update();sparkle(btn,side==='l'?'#ff8b97':'#8ebcff');card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop')}el('voteL').addEventListener('click',()=>vote('l'));el('voteB').addEventListener('click',()=>vote('b'));el('reset').addEventListener('click',()=>{if(!confirm('Apagar os votos e reiniciar o cronômetro?'))return;data={l:0,b:0,start:Date.now()};save();update();clock()});function clock(){const s=Math.floor(Math.max(0,Date.now()-data.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;const pad=n=>String(n).padStart(2,'0');el('timer').textContent=(h?pad(h)+':':'')+pad(m)+':'+pad(ss)}
update();
clock();
setInterval(clock, 1000);

// Conexão com os votos recebidos pelo TikTok LIVE
const API_VOTOS = 'https://tiktok-live-servidor.onrender.com/votos';

let votosLive = { l: 0, b: 0 };

async function atualizarVotosLive() {
  try {
    const resposta = await fetch(API_VOTOS, {
      cache: 'no-store'
    });

    if (!resposta.ok) {
      throw new Error('Servidor indisponível');
    }

    const resultado = await resposta.json();

    const lula = Number(resultado['13']);
    const bolsonaro = Number(resultado['22']);

    if (!Number.isSafeInteger(lula) || lula < 0 ||
        !Number.isSafeInteger(bolsonaro) || bolsonaro < 0) {
      return;
    }

    votosLive = { l: lula, b: bolsonaro };

    // Atualiza o placar com os votos da live
    // mais os votos manuais de teste
    const totalLula = data.l + votosLive.l;
    const totalBolsonaro = data.b + votosLive.b;
    const total = totalLula + totalBolsonaro;

    const porcentagemLula = total ? totalLula / total * 100 : 0;
    const porcentagemBolsonaro = total ? totalBolsonaro / total * 100 : 0;

    el('pL').textContent = porcentagemLula.toFixed(1).replace('.', ',') + '%';
    el('pB').textContent = porcentagemBolsonaro.toFixed(1).replace('.', ',') + '%';
    el('vL').textContent = fmt(totalLula) + ' votos';
    el('vB').textContent = fmt(totalBolsonaro) + ' votos';
    el('total').textContent = fmt(total);
    el('red').style.width = (total ? porcentagemLula : 50) + '%';

  } catch (erro) {
    console.log('Aguardando servidor:', erro.message);
  }
}

atualizarVotosLive();
setInterval(atualizarVotosLive, 2000);
  
</script></body></html>
