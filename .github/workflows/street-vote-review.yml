name: Street Vote Fighter review
on:
  push:
    branches: [codex/street-vote-fighter]
    paths:
      - tools/**
      - .github/workflows/street-vote-review.yml
      - index.html
      - src/**
      - tests/**
      - "*.png"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/inspect_assets.py
      - name: Save review assets on the review branch only
        env:
          REVIEW_BRANCH: codex/street-vote-fighter
        run: |
          test "$GITHUB_REF_NAME" = "$REVIEW_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review
          if ! git diff --cached --quiet; then
            git commit -m "Generate source asset inspection"
            git push origin "HEAD:$REVIEW_BRANCH"
          fi
